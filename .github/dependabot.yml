version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/programs/native/*"
      - "/programs/anchor/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
      - "/programs/native/*"
      - "/programs/anchor/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"