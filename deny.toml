[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Add RUSTSEC IDs here with a comment explaining why, e.g.:
  # "RUSTSEC-2023-0000", # false positive, not reachable in our usage
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"